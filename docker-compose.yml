# Local development only. The owner credentials below are not secret.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: keytree # owns the schema
      POSTGRES_PASSWORD: keytree
      POSTGRES_DB: keytree
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keytree -d keytree"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    env_file: api/.env
    environment:
      POSTGRES_HOST: db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_BASE_URL: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./api:/src
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # smtp

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./web:/src
      - /src/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
