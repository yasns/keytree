include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/base-ci.yml'
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/build-image.yml'
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/deploy.yml'

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DEPLOY_BRANCHES_REGEX: "/^(main|dev|test)$/"
  PYTHON_IMAGE: registry.cern.ch/docker.io/library/python:3.11-slim
  NODE_IMAGE: registry.cern.ch/docker.io/library/node:24-slim

sast:
  stage: test

secret_detection:
  stage: test

lint:
  stage: lint
  image: $PYTHON_IMAGE
  before_script:
    - pip install --no-cache-dir ruff==0.16.3
  script:
    - ruff check api
    - ruff format --check api

test-api:
  stage: test
  image: $PYTHON_IMAGE
  variables:
    ENVIRONMENT: test
    GIT_SHA: $CI_COMMIT_SHA
  before_script:
    - pip install --no-cache-dir -e "api[dev]"
  script:
    - pytest api/tests -v

test-web:
  stage: test
  image: $NODE_IMAGE
  before_script:
    - cd web && npm ci
  script:
    - npm run type-check
    - npm run test:unit -- --run

.build:
  extends: .build-image-template
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $DEPLOY_BRANCHES_REGEX'
      when: on_success

build-api:
  extends: .build
  variables:
    DOCKERFILE_NAME: api/Dockerfile
  before_script:
    - export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE/api"
    - EXTRA="--build-arg GIT_SHA=$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then EXTRA="$EXTRA --destination $CI_REGISTRY_IMAGE:latest"; fi
    - export EXTRA_BUILD_ARGS="$EXTRA"

build-web:
  extends: .build
  variables:
    DOCKERFILE_NAME: web/Dockerfile
  before_script:
    - export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE/web"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then export EXTRA_BUILD_ARGS="--destination $CI_REGISTRY_IMAGE:latest"; fi


.deploy:
  extends: .deploy-template
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $DEPLOY_BRANCHES_REGEX'
      when: on_success

deploy-web:
  extends: .deploy
  variables:
    IMAGESTREAM: web
    PAAS_PROJECT: keytree

deploy-api:
  extends: .deploy
  variables:
    IMAGESTREAM: api
    PAAS_PROJECT: keytree
