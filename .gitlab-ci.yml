include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/base-ci.yml'
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/build-image.yml'
  - project: 'cms-tsg/common/paas-ci-cd-templates'
    file: '/deploy.yml'

stages:
  - lint
  - test
  - build
  - migrate
  - deploy

variables:
  DEPLOY_BRANCHES_REGEX: "/^(main|dev|test)$/"
  UV_IMAGE: registry.cern.ch/docker.io/astral/uv:0.12.5-python3.11-trixie-slim
  NODE_IMAGE: registry.cern.ch/docker.io/library/node:24-slim

lint:
  stage: lint
  image: $UV_IMAGE
  script:
    - uv run --project api ruff check api
    - uv run --project api ruff format --check api


sast:
  stage: test

secret_detection:
  stage: test

test-api:
  stage: test
  image: $UV_IMAGE
  variables:
    ENVIRONMENT: test
    GIT_SHA: $CI_COMMIT_SHA
  script:
    - uv run --project api pytest api/tests -v -m "not docker"  # Skip DinD tests in CI

test-web:
  stage: test
  image: $NODE_IMAGE
  before_script:
    - cd web && npm ci
  script:
    - npm run lint
    - npm run type-check
    - npm run test:unit -- --run


.build:
  extends: .build-image-template
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $DEPLOY_BRANCHES_REGEX'
      when: on_success

build-api:
  extends: .build
  variables:
    DOCKERFILE_NAME: api/Dockerfile
  before_script:
    - export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE/api"
    - EXTRA="--build-arg GIT_SHA=$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then EXTRA="$EXTRA --destination $CI_REGISTRY_IMAGE:latest"; fi
    - export EXTRA_BUILD_ARGS="$EXTRA"

build-web:
  extends: .build
  variables:
    DOCKERFILE_NAME: web/Dockerfile
  before_script:
    - export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE/web"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then export EXTRA_BUILD_ARGS="--destination $CI_REGISTRY_IMAGE:latest"; fi


.deploy:
  extends: .deploy-template
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $DEPLOY_BRANCHES_REGEX'
      when: on_success

migrate-api:
  stage: migrate
  image: $UV_IMAGE
  environment:
    name: $CI_COMMIT_BRANCH
  variables:
    # env.py expects these, however they are not used by the migrations
    ENVIRONMENT: $CI_COMMIT_BRANCH
    SECRET_KEY: unused-by-migrations
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ $DEPLOY_BRANCHES_REGEX'
      when: on_success
  script:
    - uv run --project api alembic -c api/alembic.ini upgrade heads

deploy-web:
  extends: .deploy
  variables:
    IMAGESTREAM: web
    PAAS_PROJECT: keytree

deploy-api:
  extends: .deploy
  variables:
    IMAGESTREAM: api
    PAAS_PROJECT: keytree
