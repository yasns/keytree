[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# env.py falls back to app.config.settings, tests inject a container URL
sqlalchemy.url =

# Revisions end up in api/, which CI lints
[post_write_hooks]
hooks = ruff_fix,ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
# drops unused op/sa from empty revisions, sorts autogenerated imports
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
