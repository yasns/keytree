[project]
name = "keytree-api"
version = "0.1.0"
description = "Keytree API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic-settings>=2.15",
    "tsgauth[fastapi]==0.12.0",
    "psycopg[binary]>=3.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.19",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "pytest==8.3.4",
    "httpx2==2.10.0",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a docker daemon (testcontainers)"]
